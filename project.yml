name: StorageCleaner
options:
  bundleIdPrefix: com.selcukkirtas
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
targets:
  StorageCleaner:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/StorageCleaner
    info:
      path: Sources/StorageCleaner/Resources/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Depolama alanınızı temizleyebilmek için fotoğraf ve videolarınızı taramamız gerekiyor."
        NSPhotoLibraryAddUsageDescription: "Seçtiğiniz öğeleri albümlere kaydedebilmek için izin gerekiyor."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selcukkirtas.storagecleaner
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - StorageCleanerUITests
      gatherCoverageData: false

  StorageCleanerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/StorageCleanerUITests
    dependencies:
      - target: StorageCleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: StorageCleaner
